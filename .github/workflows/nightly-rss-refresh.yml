name: Nightly RSS refresh

on:
  schedule:
    # GitHub Actions schedules use UTC. First run: 2026-08-30 06:50 UTC;
    # subsequent runs occur every 24 hours at the same time.
    - cron: "50 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-rss-refresh
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    name: Refresh feeds and deploy Pages
    uses: ./.github/workflows/update-rss-feeds.yml
    secrets: inherit
