name: Update RSS feeds

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-rss-feeds
  cancel-in-progress: false

jobs:
  update-feeds:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: trunk

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate RSS feeds
        run: python3 rss/generate.py

      - name: Check for feed changes
        id: changes
        run: |
          if git diff --quiet -- project-files/Portfolio/web/src/jsMain/resources/rss; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated feeds
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project-files/Portfolio/web/src/jsMain/resources/rss
          git commit -m "chore: update RSS feeds"
          git pull --rebase origin trunk
          git push origin HEAD:trunk

  deploy:
    needs: update-feeds
    if: needs.update-feeds.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout updated source
        uses: actions/checkout@v4
        with:
          ref: trunk

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Kotlin 1.6.0
        uses: fwilhe2/setup-kotlin@main
        with:
          version: 1.6.0

      - name: Build website
        run: |
          cd project-files/Portfolio
          kotlinc -script buildWebsite.kts --skip-tests

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@3.7.1
        with:
          branch: gh-pages
          folder: project-files/Portfolio/build
