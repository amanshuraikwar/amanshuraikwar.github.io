name: Update RSS feeds

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: update-rss-feeds
  cancel-in-progress: false

jobs:
  update-feeds:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test RSS source parsers
        run: python3 -m unittest discover -s rss/tests -v

      - name: Generate RSS feeds
        run: python3 rss/generate.py

      - name: Upload generated feeds
        uses: actions/upload-artifact@v4
        with:
          name: rss-feeds
          path: project-files/Portfolio/web/src/jsMain/resources/rss/*.xml
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: update-feeds
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download generated feeds
        uses: actions/download-artifact@v4
        with:
          name: rss-feeds
          path: project-files/Portfolio/web/src/jsMain/resources/rss

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Kotlin 1.6.0
        uses: fwilhe2/setup-kotlin@main
        with:
          version: 1.6.0

      - name: Build website
        run: |
          cd project-files/Portfolio
          kotlinc -script buildWebsite.kts -- --skip-tests

      - name: Verify generated feeds are included in the website
        run: |
          test -s project-files/Portfolio/build/index.html
          for feed in project-files/Portfolio/web/src/jsMain/resources/rss/*.xml; do
            cmp "$feed" "project-files/Portfolio/build/rss/$(basename "$feed")"
          done

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@3.7.1
        with:
          branch: gh-pages
          folder: project-files/Portfolio/build
